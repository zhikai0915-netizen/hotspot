# ============================================================================
# hotspot 的 bundle patch —— 把热榜插件挂进 DSH 配置树
# ============================================================================
#
# 【这是什么】
#   这是插件的「挂载声明」。DSH 启动时按 bundle 层栈把各插件的 patch 叠起来
#   组成配置树，本文件就是 hotspot 这一层的内容。
#
# 【约定（踩过的坑，别改）】
#   - id 必须**全局唯一且与包名一致**：DSH STORE 上架契约按它比对 entryIds，
#     裸名（如 pet）会与其它插件的行标识冲突。
#   - 插件行那一行（"id: 值"）**绝不能写行尾注释**：商城预检用正则抓该行的值并
#     要求其后直接换行，行尾注释会让它抓不到 entry ID，整份提交被判
#     SUBMISSION_ENTRY_MISSING（与 id 叫什么名字无关）。
#   - name: 'hotspot' 解析包入口 lib/index.js（宿主半侧）；package.json 声明了
#     dsh.client，DSH 模块系统会同时把本包扫描为「浏览器插件」，向页面提供
#     /plugins/hotspot/client.js。
# ============================================================================

- insert:
    - id: hotspot
      name: 'hotspot'
